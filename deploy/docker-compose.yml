# Season Zero operator behind Caddy (automatic HTTPS via Let's Encrypt).
#   cp deploy/.env.example deploy/.env   # set ARES_DOMAIN and ARES_DATA
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  operator:
    image: ares-lite-operator:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ${ARES_DATA}/season:/season
      - ${ARES_DATA}/keys:/keys:ro
    expose:
      - "8787"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      operator:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARES_DOMAIN: ${ARES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
