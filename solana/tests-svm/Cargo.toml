[package]
name = "ares-lite-svm-tests"
version = "0.1.0"
edition = "2021"
description = "LiteSVM integration tests for the ARES Lite rewards program (loads the built SBF .so)."
license = "MIT"
publish = false
rust-version = "1.97.1"

[dev-dependencies]
litesvm = "=0.17.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-instruction = "3.5"
solana-transaction = "4.3"
solana-account = "4.7"
sha2 = "0.10"
solana-clock = "3.2"
